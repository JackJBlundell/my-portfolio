<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Apply the saved (or system) colour theme before first paint to avoid a flash -->
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0A1120' : '#ffffff');
      })();
    </script>

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Blundell Tech" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!--
      Title, description, robots, canonical URL and social tags are rendered per page by src/components/SEO.tsx.
      Only a fallback title lives here so pages don't all inherit the homepage's canonical and share tags.
    -->
    <title data-fallback>Software Development Company UK | Blundell Technologies</title>
    <meta name="author" content="Blundell Technologies" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://blundell-labs.com/#organization",
          "name": "Blundell Technologies",
          "url": "https://blundell-labs.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://blundell-labs.com/img/brand/logo-on-light.png",
            "width": 440,
            "height": 222
          },
          "image": "https://blundell-labs.com/og-image.jpg",
          "description": "Cardiff-based software development company building custom software, web applications and iOS & Android apps for businesses across the UK.",
          "founder": {
            "@type": "Person",
            "name": "Jack Blundell"
          },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Cardiff",
            "addressRegion": "Wales",
            "addressCountry": "GB"
          },
          "areaServed": {
            "@type": "Country",
            "name": "United Kingdom"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "jackjblundell@gmail.com",
            "contactType": "sales",
            "areaServed": "GB",
            "availableLanguage": "English"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://blundell-labs.com/#website",
          "url": "https://blundell-labs.com/",
          "name": "Blundell Technologies",
          "inLanguage": "en-GB",
          "publisher": {
            "@id": "https://blundell-labs.com/#organization"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
